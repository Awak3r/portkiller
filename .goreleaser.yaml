version: 2

project_name: portkiller

builds:
  - main: ./cmd/portkiller
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/Awak3r/PortKiller/internal/version.Version={{.Version}}
      - -X github.com/Awak3r/PortKiller/internal/version.Commit={{.ShortCommit}}
      - -X github.com/Awak3r/PortKiller/internal/version.Date={{ time "2006-01-02" }}

archives:
  - formats: [tar.gz]


checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc